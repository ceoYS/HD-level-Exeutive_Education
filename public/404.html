    <title>HDEC AI BUILD</title>
    <script>
      ;(() => {
        const base = '/HD-level-Exeutive_Education/'

        window.location.replace(`${base}?__spa=${encodeURIComponent(`${route}${search}${hash}`)}`)
      })()
    </script>
